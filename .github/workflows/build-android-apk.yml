name: Build native Android preview APK

on:
  push:
    paths:
      - 'mobile/flutter/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag for the preview APK (leave empty to only create an artifact)
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Android APK
        working-directory: mobile/flutter
        run: |
          flutter pub get
          flutter build apk --release
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: subastas-del-campo-android
          path: mobile/flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          APK: ${{ github.workspace }}/mobile/flutter/build/app/outputs/flutter-apk/app-release.apk
        run: |
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Subastas del Campo $TAG" \
            --notes "Aplicación Android nativa de demostración. No usa WebView. Los datos permanecen en el dispositivo hasta integrar el backend compartido." \
            --latest=false || gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
