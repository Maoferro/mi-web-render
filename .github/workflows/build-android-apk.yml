name: Build native Android preview APK

on:
  push:
    paths:
      - 'mobile/flutter/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag for the preview APK (leave empty to only create an artifact)
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform project
        run: flutter create --platforms=android --org co.fumigo --project-name subastas_del_campo --empty "$RUNNER_TEMP/subastas_del_campo"
      - name: Add shared Flutter app source
        run: |
          cp mobile/flutter/pubspec.yaml "$RUNNER_TEMP/subastas_del_campo/pubspec.yaml"
          rm -rf "$RUNNER_TEMP/subastas_del_campo/lib"
          cp -R mobile/flutter/lib "$RUNNER_TEMP/subastas_del_campo/lib"
          sed -i 's/android:label="subastas_del_campo"/android:label="Subastas del Campo"/' "$RUNNER_TEMP/subastas_del_campo/android/app/src/main/AndroidManifest.xml"
      - name: Build Android APK
        working-directory: ${{ runner.temp }}/subastas_del_campo
        run: |
          flutter pub get
          flutter build apk --release
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: subastas-del-campo-android
          path: ${{ runner.temp }}/subastas_del_campo/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Prepare Android platform files
        run: |
          rm -rf "$RUNNER_TEMP/subastas_del_campo/android/.gradle" \
            "$RUNNER_TEMP/subastas_del_campo/android/build" \
            "$RUNNER_TEMP/subastas_del_campo/android/app/build"
          rm -f "$RUNNER_TEMP/subastas_del_campo/android/local.properties"
      - name: Upload Android platform project
        uses: actions/upload-artifact@v4
        with:
          name: subastas-del-campo-android-platform
          path: ${{ runner.temp }}/subastas_del_campo/android
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          APK: ${{ runner.temp }}/subastas_del_campo/build/app/outputs/flutter-apk/app-release.apk
        run: |
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Subastas del Campo $TAG" \
            --notes "Aplicación Android nativa de demostración. No usa WebView. Los datos permanecen en el dispositivo hasta integrar el backend compartido." \
            --latest=false || gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
